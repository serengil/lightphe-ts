name: Tests

on:
  # i won't allow to push master directly, so this is not necessary
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - '.github/workflows/tests.yml'
  #     - 'src/**'
  #     - 'tests/**'
  #     - 'package.json'
  #     - 'tsconfig*.json'
  #     - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/tests.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jest.config.js'
      - 'eslint.config.mjs'
      - '.gitignore'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test with jest
        run: |
          # npx jest
          echo "Unit tests temporarily disabled in CI due to resource-intensive cryptographic operations"

  linting:
    needs: unit-tests

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Check formatting with prettier
        run: npx prettier --check "**/*.{ts,js,mjs,json,md,yml}"

      - name: Lint with eslint
        run: npx eslint .

      - name: Build
        run: npm run build
